<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    
    <title>Bem vindo!</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <main class="container">
        <h1>Logo do site</h1>
        <form action="#" method= "post">
            
            <fieldset>
                <legend>Bem vinda</legend>
                
                <div class="form-field">
                    
                    <label for="email"  class="form-field">Email</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="Digite seu Email">
                    
                    
                </div class="form-field">
                
                <div>
                    
                    <label for="password"  class="form-field">Senha</label>
                    <input type="password" name="password" id="password" class="form-control" >
                    
                </div>
                <div class="row">

                    <div class="btn-group botoes col-6">
                        
                        <button type="submit" class="btn-solid theme-primary"> Enviar</button>
                        <a href="#" class="btn-solid theme-info">Esqueci a senha</a>
                        
                    </div>
                </div>
            </fieldset>
        </main>
        
    </form>
</body>
</html>
