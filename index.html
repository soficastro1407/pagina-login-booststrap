<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>Bem vindo!</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <main class="container">
        <div>

            <h1>Logo do site</h1>
            <form action="#" method= "post">
                
                <fieldset>
                    <legend>Bem vindo</legend>
                    
                    <div class="form-field row">
                        
    
                        <label for="email"  class="form-field">Email</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="Digite seu Email">
                            
                        
                    </div>
                    
                    <div class="row">
                    
    
                        <label for="password"  class="form-field">Senha</label>
                        <input type="password" name="password" id="password" class="form-control" >
                            
                        
                    </div>
    
                        
                        
    
                    <div class="row">
    
                        <div class="btn-group botoes ">
                            
                            <button type="submit" class="btn-solid theme-primary"> Enviar</button>
                            <a href="./twa.html" class="btn-solid theme-info">Esqueci a senha</a>
                            
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>
    </main>
</body>
</html>
